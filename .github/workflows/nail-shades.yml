name: Validate and sync Nail Lab shades
on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: nail-shades
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate supplier exports
        env:
          CRYSTAL_CLAWZ_SHADE_FEED: ${{ secrets.CRYSTAL_CLAWZ_SHADE_FEED }}
          GEL_IT_SHADE_FEED: ${{ secrets.GEL_IT_SHADE_FEED }}
        run: python3 scripts/sync-nail-shades.py
      - name: Publish validated changes
        run: |
          if git diff --quiet -- public/data/nail-shades.json; then
            echo 'Shade snapshot unchanged'
            exit 0
          fi
          git config user.name 'Nail Lab shade sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/nail-shades.json
          git commit -m 'Sync verified Nail Lab shades'
          git push origin HEAD:main
