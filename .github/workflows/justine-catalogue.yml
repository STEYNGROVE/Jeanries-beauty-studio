name: Sync Justine catalogue

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: justine-catalogue
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalogue and expire promotions
        env:
          JUSTINE_CATALOGUE_FEED_URL: ${{ secrets.JUSTINE_CATALOGUE_FEED_URL }}
        run: python3 scripts/sync-catalogue.py
      - name: Publish changed catalogue
        run: |
          if git diff --quiet -- public/data/catalogue.json; then
            echo 'Catalogue unchanged'
            exit 0
          fi
          git config user.name 'Jeanrie catalogue sync'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/catalogue.json
          git commit -m 'Sync validated Justine catalogue'
          git push origin HEAD:main
