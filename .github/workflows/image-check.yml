name: Check site images

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/check-images.py'
      - 'scripts/check-glam-wall.py'
      - 'scripts/test-roulette.mjs'
      - '.github/workflows/image-check.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'scripts/check-images.py'
      - 'scripts/check-glam-wall.py'
      - 'scripts/test-roulette.mjs'
      - '.github/workflows/image-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/test-roulette.mjs
      - run: python3 scripts/check-glam-wall.py
      - run: python3 scripts/check-images.py
